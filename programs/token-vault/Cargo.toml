[package]
name = "token-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }

[dev-dependencies]
litesvm = "=0.13.0"
solana-account = "3.4"
solana-address = "=2.2.0"
solana-instruction = "=3.2.0"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "3.1"
solana-clock = "3.0"
